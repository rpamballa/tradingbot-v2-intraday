environment: "paper"

broker:
  name: "alpaca"
  api_key: "YOUR_ALPACA_API_KEY"
  api_secret: "YOUR_ALPACA_SECRET"
  base_url: "https://paper-api.alpaca.markets"

trading:
  symbols: []
  bar_interval: "5Min"
  max_capital: 10000
  max_position_per_symbol_pct: 20
  max_daily_loss_pct: 2

multi_strategy:
  enabled: true
  strategies:
    - name: "sma_trend"
      type: "sma_crossover"
      enabled: true
      symbols: ["AAPL", "MSFT"]
      params:
        short_window: 10
        long_window: 30
        risk_per_trade_pct: 5
        max_open_trades: 5
        min_sma_diff_pct: 0.1
    - name: "mr_rsi"
      type: "mean_reversion_rsi"
      enabled: true
      symbols: ["SPY"]
      params:
        lookback: 7
        oversold: 25
        overbought: 75
        risk_per_trade_pct: 3
        max_open_trades: 3

safety:
  global_enabled: true
  allow_new_trades: true
  max_total_open_positions: 10

  atr_lookback: 14
  atr_stop_loss_mult: 1.5
  atr_take_profit_mult: 3.0

logging:
  level: "INFO"
